<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A2A Mesh Command Center</title>

    <!-- Xterm.js -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>

    <!-- vis-network -->
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #1e1e1e; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        h1 { margin-top: 0; color: #5ce1e6; font-size: 1.5em; }
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 20px; flex: 1; overflow: hidden; }
        .panel { background: #252526; border: 1px solid #333; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; }

        #topology-panel { grid-column: 1 / 2; grid-row: 1 / 2; }
        #network-graph { flex: 1; border: 1px solid #333; background: #111; border-radius: 6px; }

        #control-panel { grid-column: 1 / 2; grid-row: 2 / 3; }
        #logs { flex: 1; overflow-y: auto; font-family: monospace; font-size: 12px; background: #000; padding: 10px; border-radius: 6px; margin-bottom: 10px;}
        .log-entry { margin-bottom: 4px; border-bottom: 1px dashed #222; padding-bottom: 4px; }

        #terminal-panel { grid-column: 2 / 3; grid-row: 1 / 3; }
        #terminal { flex: 1; background: #000; padding: 10px; border-radius: 6px; overflow: hidden;}

        input[type="text"] { width: calc(100% - 90px); padding: 8px; border: 1px solid #555; background: #333; color: #fff; border-radius: 4px; }
        button { padding: 8px 16px; background: #5ce1e6; color: #000; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { background: #4bb8bd; }
        .form-row { display: flex; gap: 10px; }

        .task-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            margin-left: 6px;
        }
        .task-submitted { background: #3498db; color: white; }
        .task-working { background: #f39c12; color: white; }
        .task-input-required { background: #e74c3c; color: white; animation: pulse 1.5s infinite; }
        .task-completed { background: #27ae60; color: white; }
        .task-failed { background: #c0392b; color: white; }
        .task-canceled { background: #7f8c8d; color: white; }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <h1>A2A Mesh Command Center</h1>
    <div class="grid-container">
        <!-- TOP LEFT: Topology Graph -->
        <div class="panel" id="topology-panel">
            <h2 style="margin-top:0; font-size:1.1em;">Mesh Topology</h2>
            <div id="network-graph"></div>
        </div>

        <!-- BOTTOM LEFT: Event Logs & Control -->
        <div class="panel" id="control-panel">
            <h2 style="margin-top:0; font-size:1.1em;">A2A Event Trace</h2>
            <div id="logs"></div>

            <!-- A2A Task Approval Section -->
            <div id="approval-section" style="display:none; margin-bottom: 10px; background: #331; padding: 10px; border: 1px solid #f39c12; border-radius: 4px;">
                <strong style="color: #f39c12">Approval Required:</strong>
                <div id="approval-task-id" style="font-family: monospace; font-size: 11px; color: #aaa; margin: 2px 0;"></div>
                <div id="approval-command" style="font-family: monospace; margin: 5px 0;"></div>
                <div class="form-row">
                    <button id="approve-btn" style="background: #27ae60; color: white;">Approve</button>
                    <button id="reject-btn" style="background: #e74c3c; color: white;">Reject</button>
                </div>
            </div>

            <div class="form-row">
                <input type="text" id="command-input" placeholder="e.g. List files in the current directory" />
                <button id="send-btn">Inject</button>
            </div>
        </div>

        <!-- RIGHT: Terminal Stream -->
        <div class="panel" id="terminal-panel">
            <h2 style="margin-top:0; font-size:1.1em;">Multiplexed PTY Stream</h2>
            <div id="terminal"></div>
        </div>
    </div>

    <script>
        // Setup Xterm
        const term = new Terminal({ theme: { background: '#000' } });
        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal'));
        fitAddon.fit();
        window.onresize = () => fitAddon.fit();
        term.writeln('\x1b[32m[System]\x1b[0m Terminal Ready.');

        // Setup vis-network
        const nodes = new vis.DataSet([{ id: 'harness', label: 'Harness Router', color: '#e74c3c' }]);
        const edges = new vis.DataSet([]);
        const container = document.getElementById('network-graph');
        const data = { nodes: nodes, edges: edges };
        const options = {
            nodes: { shape: 'dot', size: 20, font: { color: '#fff' }, borderWidth: 2 },
            edges: { color: '#888', arrows: 'to' },
            physics: { barnesHut: { gravitationalConstant: -2000, centralGravity: 0.3, springLength: 95 } }
        };
        const network = new vis.Network(container, data, options);

        // Setup WebSocket
        const ws = new WebSocket("ws://" + location.host + "/ws");
        const logsDiv = document.getElementById('logs');
        let activeAgents = {};
        let pendingApprovalTaskId = null;
        let pendingApprovalSender = null;

        function appendLog(color, source, message, badge) {
            const el = document.createElement('div');
            el.className = 'log-entry';
            const time = new Date().toLocaleTimeString();
            let badgeHtml = '';
            if (badge) {
                badgeHtml = `<span class="task-badge task-${badge.state}">${badge.state}</span>`;
            }
            el.innerHTML = `[${time}] <strong style="color:${color}">[${source}]</strong> ${message}${badgeHtml}`;
            logsDiv.appendChild(el);
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }

        function updateTopology() {
            const nodeIds = nodes.getIds().filter(id => id !== 'harness');
            nodes.remove(nodeIds);
            edges.clear();

            for (const [id, info] of Object.entries(activeAgents)) {
                let capsStr = info.capabilities ? info.capabilities.join(',') : '';
                let toolsStr = info.tools && info.tools.length > 0 ? '\nTools: ' + info.tools.join(',') : '';
                nodes.add({ id: id, label: `${id}\n[${capsStr}]${toolsStr}`, color: '#5ce1e6' });
                edges.add({ from: id, to: 'harness' });
            }
        }

        ws.onmessage = (e) => {
            const msg = JSON.parse(e.data);

            if (msg.type === "state_update") {
                activeAgents = msg.agents;
                updateTopology();
                appendLog('#4ade80', 'Harness', 'Topology graph updated.');

            } else if (msg.type === "acp_trace") {
                const trace = msg.data;
                appendLog('#60a5fa', 'ACP', `${trace.sender} \u2192 ${trace.target || '*'}: <strong>${trace.method}</strong>`);
                if (trace.target && nodes.get(trace.target) && nodes.get(trace.sender)) {
                    const edgeId = trace.sender + '-' + trace.target;
                    try {
                        edges.add({ id: edgeId, from: trace.sender, to: trace.target, color: { color: '#f39c12' }, dashes: true });
                        setTimeout(() => edges.remove(edgeId), 1000);
                    } catch(e) {}
                }

            } else if (msg.type === "task_update") {
                const taskId = msg.taskId || msg.task_id;
                const status = msg.status;
                const state = status.state;
                const message = status.message || '';

                appendLog('#9b59b6', 'A2A', `Task ${taskId}: ${message}`, { state: state });

                if (state === 'input-required') {
                    pendingApprovalTaskId = taskId;
                    // Try to extract command from message
                    let cmd = message;
                    if (message.includes('Approval required for:')) {
                        cmd = message.split('Approval required for:')[1].trim();
                    }
                    document.getElementById('approval-task-id').innerText = taskId;
                    document.getElementById('approval-command').innerText = cmd;
                    document.getElementById('approval-section').style.display = 'block';
                }

                if (state === 'completed' || state === 'failed' || state === 'canceled') {
                    document.getElementById('approval-section').style.display = 'none';
                    pendingApprovalTaskId = null;
                }

            } else if (msg.type === "pty_stream") {
                term.write(msg.data);

            } else if (msg.type === "log") {
                appendLog('#f1c40f', msg.source, msg.message);
            }
        };

        ws.onopen = () => appendLog('#4ade80', 'System', 'WebSocket connected.');

        // Approval Handling (A2A: send to harness, which routes to worker)
        document.getElementById('approve-btn').onclick = () => {
            if (pendingApprovalTaskId && ws.readyState === WebSocket.OPEN) {
                const acpMsg = {
                    jsonrpc: "2.0",
                    method: "approval_response",
                    sender: "ui_user",
                    target: "harness",
                    params: { task_id: pendingApprovalTaskId, status: "approved" }
                };
                ws.send(JSON.stringify(acpMsg));
                appendLog('#27ae60', 'UI', `Approved task ${pendingApprovalTaskId}`);
                document.getElementById('approval-section').style.display = 'none';
            }
        };

        document.getElementById('reject-btn').onclick = () => {
            if (pendingApprovalTaskId && ws.readyState === WebSocket.OPEN) {
                const acpMsg = {
                    jsonrpc: "2.0",
                    method: "approval_response",
                    sender: "ui_user",
                    target: "harness",
                    params: { task_id: pendingApprovalTaskId, status: "rejected" }
                };
                ws.send(JSON.stringify(acpMsg));
                appendLog('#e74c3c', 'UI', `Rejected task ${pendingApprovalTaskId}`);
                document.getElementById('approval-section').style.display = 'none';
            }
        };

        document.getElementById('send-btn').onclick = () => {
            const input = document.getElementById('command-input');
            const text = input.value.trim();
            if (text && ws.readyState === WebSocket.OPEN) {
                const acpMsg = {
                    jsonrpc: "2.0",
                    method: "user_intent",
                    sender: "ui_user",
                    target: "manager",
                    params: { command: text }
                };
                ws.send(JSON.stringify(acpMsg));
                appendLog('#e74c3c', 'UI', `Injected command: ${text}`);
                input.value = '';
            }
        };
        document.getElementById('command-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') document.getElementById('send-btn').click();
        });
    </script>
</body>
</html>
